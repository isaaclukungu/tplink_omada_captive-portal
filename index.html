<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css" type="text/css" />
    <title>WiFi Login</title>
</head>

<body class="portal">
    <div class="page-bg"></div>

    <main class="center-wrap">
        <div class="card">

            <!-- Greeting banner: colors driven by index.css variables -->
            <div class="card-banner">
                <div class="greeting-text" id="greeting-text">Good Day</div>
                <div class="banner-sub-row">
                    <span class="date-text" id="date-text">Today is --</span>
                    <span class="time-text" id="time-text">--:--:--</span>
                </div>
            </div>

            <div class="card-form">
                <span id="oper-hint" class="oper-hint"></span>

                <div id="hotspot-section" class="hotspot-section">
                    <div class="select-wrap">
                        <select id="hotspot-selector" class="oper-section-item select"></select>
                        <svg class="select-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    </div>
                </div>

                <form id="login-form" autocomplete="off">
                    <div id="input-voucher" class="field">
                        <span class="field-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5v2M15 11v2M15 17v2"/><path d="M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2z"/></svg>
                        </span>
                        <input id="voucherCode" class="oper-section-item input" name="voucherCode" type="text" placeholder="Voucher Code"/>
                    </div>

                    <div id="input-user" class="field">
                        <input id="username" class="oper-section-item input" name="username" type="text" placeholder="Username"/>
                    </div>

                    <div id="input-password" class="field user-input">
                        <input id="password" class="oper-section-item input" name="password" type="password" placeholder="Password"/>
                    </div>

                    <div id="input-simple" class="field">
                        <input id="simplePassword" class="password oper-section-item input" name="simplePassword" type="password" placeholder="Password"/>
                    </div>

                    <div id="input-phone-num" class="field phone-field">
                        <span class="add">+</span>
                        <input id="country-code" class="input country-code-input">
                        <input id="phone-number" class="input" name="phone-number" type="text" placeholder="Phone Number"/>
                    </div>

                    <div id="input-verify-code" class="field verify-field">
                        <input id="verify-code" class="input" name="verify-code" type="text" placeholder="Verification Code"/>
                        <button id="get-code" class="get-code-button" type="button">Get Code</button>
                    </div>

                    <input name="clientMac" id="cMac" style="display:none"/>
                    <input name="radiusSvrIp" id="radiusServerIp" style="display:none"/>
                </form>

                <div id="button-area">
                    <button id="button-login" class="button oper-section-item">CONNECT</button>
                </div>
            </div>

        </div>
    </main>

    <div id="form-auth-msg">
        <div id="form-auth-outer">
            <div id="form-auth-close"></div>
            <div id="form-auth-inner">
                <div id="form-auth-header">
                    <div id="form-auth-title"></div>
                    <div id="form-auth-note"></div>
                </div>
                <div id="form-auth-content"></div>
                <div id="form-auth-footer">
                    <a id="form-auth-submit" href="javascript:void(0);">Submit</a>
                </div>
            </div>
        </div>
    </div>

    <script src="jquery.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
